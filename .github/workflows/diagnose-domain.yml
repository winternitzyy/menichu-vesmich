name: Diagnose domain (temporary)
on:
  push:
    branches: [claude/tender-cerf-h8ffme]
    paths: [.github/workflows/diagnose-domain.yml]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright
        run: |
          npm init -y >/dev/null
          npm i playwright@1.56.1 >/dev/null
          npx playwright install --with-deps chromium >/dev/null
      - name: Render live site
        run: |
          cat > check.cjs <<'JS'
          const { chromium } = require("playwright");
          (async () => {
            const b = await chromium.launch();
            for (const url of ["https://menichuvesmichu.org/", "https://menichuvesmichu.org/past-events", "https://menichu.khwestcliff.org/"]) {
              const p = await b.newPage();
              const logs = [];
              p.on("console", m => logs.push(`console.${m.type()}: ${m.text()}`));
              p.on("pageerror", e => logs.push(`PAGE ERROR: ${e.message}\n${e.stack}`));
              p.on("requestfailed", r => logs.push(`REQUEST FAILED: ${r.url()} ${r.failure()?.errorText}`));
              p.on("response", r => { if (r.status() >= 400) logs.push(`HTTP ${r.status()}: ${r.url()}`); });
              await p.goto(url, { waitUntil: "networkidle", timeout: 30000 }).catch(e => logs.push("GOTO: " + e.message));
              await p.waitForTimeout(2000);
              const text = await p.evaluate(() => document.body.innerText.slice(0, 300)).catch(e => "eval failed: " + e.message);
              const rootLen = await p.evaluate(() => document.getElementById("root")?.innerHTML.length ?? -1).catch(() => -2);
              console.log(`\n===== ${url}\nfinal url: ${p.url()}\n#root html length: ${rootLen}\nbody text: ${JSON.stringify(text)}\n${logs.join("\n")}`);
              await p.close();
            }
            await b.close();
          })();
          JS
          node check.cjs
