name: Import images from Manus

# Run once (Actions tab → "Import images from Manus" → Run workflow) while the
# old Manus site is still online. It downloads every photo/logo into
# client/public/images/ and commits them, so the site no longer needs Manus.

on:
  workflow_dispatch:
    inputs:
      site_url:
        description: "Address of the site still running on Manus"
        default: "https://menichu.khwestcliff.org"
        required: true

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Download images
        id: download
        continue-on-error: true
        run: node scripts/import-manus-images.mjs "${{ inputs.site_url }}"

      - name: Commit images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          git add client/public/images
          if git diff --cached --quiet; then
            echo "No new images to commit."
          else
            git commit -m "Import site images from Manus hosting"
            git push
          fi

      - name: Report missing images
        if: steps.download.outcome == 'failure'
        run: |
          echo "::error::Some images could not be downloaded — see the 'Download images' step log."
          exit 1
